[project]
name = "content-orchestrator-worker"
version = "0.1.0"
description = "HumanGate background worker service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "httpx>=0.27,<0.29",
    "urllib3>=2.7.0,<3.0",
    "idna>=3.15,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.3,<2.0",
    "ruff>=0.7,<0.15",
    "pip-audit>=2.7,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# "S" (flake8-bandit) matches apps/api — see the note there (audit M-1).
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 is pytest's entire assertion mechanism. Production code is not exempt.
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["worker*"]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

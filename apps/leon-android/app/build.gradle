plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.leon.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.leon.companion'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // A lint regression should fail the build rather than be filtered out of the report.
        warningsAsErrors false
        abortOnError true
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

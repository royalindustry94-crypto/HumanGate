plugins {
    id 'com.android.application'
}

// versionCode must only ever increase within one signing key, or Android refuses the update as a
// downgrade. CI passes its workflow run number. A release build must be given one explicitly
// (see the release check below). Plain local debug builds fall back to 1, so they never install
// over a CI build by accident.
def leonVersionCodeProperty = project.findProperty('leonVersionCode')
def leonVersionCode = (leonVersionCodeProperty ?: '1') as int

// Release signing comes only from the environment, never from the repository. A release key
// that is lost or leaked cannot be replaced without every user uninstalling, so it lives in a
// secret store, and the build refuses to produce a release APK without it rather than silently
// emitting an unsigned one.
def leonReleaseKeystore = System.getenv('LEON_RELEASE_KEYSTORE')
def generatedLeonAssets = layout.buildDirectory.dir("generated/leonAssets")

android {
    namespace 'ai.leon.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.leon.companion'
        minSdk 26
        targetSdk 35
        versionCode leonVersionCode
        versionName "0.3.${leonVersionCode}"
    }

    // Test builds use a dedicated, public debug-only key committed with the project.
    // It is intentionally NOT a production signing key. Keeping it stable means each
    // sideloaded Leon APK can update the previous test build instead of forcing an uninstall.
    signingConfigs {
        debug {
            storeFile file('leon-ci-debug.keystore')
            storePassword 'leon-debug-only'
            keyAlias 'leon-debug'
            keyPassword 'leon-debug-only'
        }
        if (leonReleaseKeystore) {
            release {
                storeFile file(leonReleaseKeystore)
                storePassword System.getenv('LEON_RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LEON_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('LEON_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (leonReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        warningsAsErrors false
        abortOnError true
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }

    sourceSets {
        main {
            assets.srcDir(generatedLeonAssets)
        }
    }
}

tasks.register("generateLeonProduction", Exec) {
    inputs.file("../../../docs/leon-reference/leon-front-source.png")
    inputs.file("src/main/assets/leon/leon-front.txt")
    inputs.file("../tools/build_leon_production.py")
    outputs.dir(generatedLeonAssets)
    commandLine "python3", "../tools/build_leon_production.py",
            "--source", "../../../docs/leon-reference/leon-front-source.png",
            "--landmarks", "src/main/assets/leon/leon-front.txt",
            "--out", generatedLeonAssets.get().asFile.absolutePath + "/leon/production"
}

tasks.named("preBuild").configure {
    dependsOn("generateLeonProduction")
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Fail closed: packaging a release APK without the release key, or without an explicit
// versionCode, is an error, not an unsigned or downgrading APK. Debug builds are unaffected.
gradle.taskGraph.whenReady { graph ->
    def packagingRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(assemble|bundle|package)Release/
    }
    if (!packagingRelease) return
    def missing = []
    if (!leonReleaseKeystore) missing << 'LEON_RELEASE_KEYSTORE'
    ['LEON_RELEASE_KEYSTORE_PASSWORD', 'LEON_RELEASE_KEY_ALIAS', 'LEON_RELEASE_KEY_PASSWORD'].each {
        if (!System.getenv(it)) missing << it
    }
    if (!leonVersionCodeProperty) missing << '-PleonVersionCode'
    if (!missing.isEmpty()) {
        throw new GradleException("Leon release build refused, missing: " + missing.join(', ')
                + ". Release APKs must be signed with the release key and carry an explicit, "
                + "increasing versionCode.")
    }
}


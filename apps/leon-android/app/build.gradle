plugins {
    id 'com.android.application'
}

def leonVersionCode = (project.findProperty('leonVersionCode') ?: '3') as int

android {
    namespace 'ai.leon.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.leon.companion'
        minSdk 26
        targetSdk 35
        versionCode leonVersionCode
        versionName '0.3.0'
    }

    // Test builds use a dedicated, public debug-only key committed with the project.
    // It is intentionally NOT a production signing key. Keeping it stable means each
    // sideloaded Leon APK can update the previous test build instead of forcing an uninstall.
    signingConfigs {
        debug {
            storeFile file('leon-ci-debug.keystore')
            storePassword 'leon-debug-only'
            keyAlias 'leon-debug'
            keyPassword 'leon-debug-only'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        warningsAsErrors false
        abortOnError true
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

[project]
name = "content-orchestrator-api"
version = "0.1.0"
description = "HumanGate API service (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0,<0.141",
    "starlette>=0.52.1,<2.0",
    "uvicorn[standard]>=0.34,<0.40",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.17",
    "PyJWT>=2.13.0,<3.0",
    "cryptography>=50.0.0,<51.0",
    "python-multipart>=0.0.17",
    "stripe>=11.0,<13.0",
    "httpx>=0.27,<0.29",
    # Patched transitive floors (P-004) — keep explicit so resolvers cannot
    # reintroduce known-vulnerable minors via FastAPI/httpx/alembic.
    "jinja2>=3.1.6,<4.0",
    "urllib3>=2.7.0,<3.0",
    "idna>=3.15,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.3,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.7,<0.15",
    "pip-audit>=2.7,<3.0",
    "mypy>=1.13,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# "S" is flake8-bandit. It was absent while the codebase already carried
# `# noqa: S608` markers, so those suppressions were inert and nothing
# enforced the security rules they implied — one of them was even attached to
# the wrong line, which no one could notice with the rules off (audit M-1).
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection intentionally calls Depends()/dependency
# factories in argument defaults; ruff's documented accommodation is to
# mark them immutable rather than suppress B008 file-by-file.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "app.core.authorization.require_workspace_member",
]

[tool.ruff.lint.per-file-ignores]
# Migration files embed long raw SQL (policies, grants, index predicates)
# where wrapping would hurt readability; they are append-only history.
# S608 because their table names are module constants written by hand in the
# migration itself, never request input. All other rules still apply to them.
"alembic/versions/*.py" = ["E501", "S608"]
# Test-only relaxations. S101 is pytest's entire assertion mechanism; the
# password rules fire on deliberate fixture credentials that exist to be
# rejected or to exercise the auth paths; S607/S608 cover test harness
# subprocess and SQL setup. Production code gets no such exemption.
"tests/*.py" = ["S101", "S105", "S106", "S607", "S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

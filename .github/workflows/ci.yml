name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_orchestrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_orchestrator_test
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/content_orchestrator_test
      SUPABASE_JWT_SECRET: ci-test-supabase-jwt-secret
      ENVIRONMENT: test
      AUTH_MODE: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints-prod.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Migration replay
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy app/
      - name: Test with coverage gate
        run: pytest --cov=app --cov-fail-under=79

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints-prod.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_orchestrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_orchestrator_test
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/content_orchestrator_test
      ENVIRONMENT: development
      AUTH_MODE: local
      CORS_ALLOW_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
      OPS_PREVIEW_EMAIL: browser-smoke@example.com
      OPS_PREVIEW_PASSWORD: browser-smoke-password-2026
      DEMO_EMAIL: browser-smoke@example.com
      DEMO_PASSWORD: browser-smoke-password-2026
      UI_SMOKE_BASE: http://127.0.0.1:5173
      UI_SMOKE_OUT: /tmp/content-orchestrator-browser-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Generate ephemeral browser-smoke JWT secret
        run: |
          secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "SUPABASE_JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]" -c constraints-prod.txt
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Migrate preview database
        working-directory: apps/api
        run: alembic upgrade head
      - name: Start API and web
        run: |
          mkdir -p "$UI_SMOKE_OUT"
          (cd apps/api && uvicorn app.main:app --host 127.0.0.1 --port 8000 >"$UI_SMOKE_OUT/api.log" 2>&1 & echo $! >"$UI_SMOKE_OUT/api.pid")
          (cd apps/web && npm run dev -- --host 127.0.0.1 --port 5173 --strictPort >"$UI_SMOKE_OUT/web.log" 2>&1 & echo $! >"$UI_SMOKE_OUT/web.pid")
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health/ready >/dev/null && curl -sf http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Preview services failed readiness" >&2
          cat "$UI_SMOKE_OUT/api.log" || true
          cat "$UI_SMOKE_OUT/web.log" || true
          exit 1
      - name: Seed browser-smoke workspace
        run: API_BASE_URL=http://127.0.0.1:8000 python3 scripts/seed_ops_preview.py >"$UI_SMOKE_OUT/seed.log" 2>&1
      - name: Start headless Chrome with CDP
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank >"$UI_SMOKE_OUT/chrome.log" 2>&1 &
          echo $! >"$UI_SMOKE_OUT/chrome.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9222/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Chrome CDP failed readiness" >&2
          cat "$UI_SMOKE_OUT/chrome.log" || true
          exit 1
      - name: Run exact desktop and 390px smoke
        run: node scripts/ui_smoke_cdp.mjs 2>&1 | tee "$UI_SMOKE_OUT/smoke.log"
      - name: Record candidate identity
        if: always()
        run: |
          printf 'candidate_sha=%s\nchecked_out_sha=%s\nworkflow_head_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$CANDIDATE_SHA" "$(git rev-parse HEAD)" "${{ github.event.pull_request.head.sha || github.sha }}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$UI_SMOKE_OUT/candidate.txt"
      - name: Upload browser-smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-${{ env.CANDIDATE_SHA }}
          path: /tmp/content-orchestrator-browser-smoke
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate Claude/Codex exact-head gate
        run: |
          python - <<'PY'
          from pathlib import Path

          def service_block(text: str, service: str) -> str:
              body = []
              capture = False
              for line in text.splitlines():
                  if not capture:
                      if line == f"  {service}:":
                          capture = True
                      continue
                  if line.startswith("  ") and not line.startswith("    "):
                      break
                  body.append(line)
              assert capture, f"missing service block: {service}"
              return "\n".join(body)

          workflow = Path(".github/workflows/claude.yml").read_text()
          expected_group = (
              "group: claude-lead-"
              + "$"
              + "{{ github.repository }}"
          )
          required = (
              expected_group,
              "timeout-minutes: 30",
              "contents: write",
              "pull-requests: write",
              "additional_permissions: |",
              "CODEX_BASELINE: PASS",
              "CODEX_AUDIT: ${verdict}",
              "Authorized starting SHA",
              "authorized_ref",
              "Verify exact authorized checkout",
              "CODEX_REMEDIATION: APPROVED",
              "Begin the final handoff by minute 25",
              "Do not merge, approve, self-certify",
              "github.event.comment.user.login == github.repository_owner",
          )
          missing = [value for value in required if value not in workflow]
          assert not missing, f"Claude workflow guard missing: {missing}"

          gate = Path(".github/workflows/codex-audit-gate.yml").read_text()
          gate_required = (
              "pull_request_target:",
              "statuses: write",
              "CODEX_AUDIT: PASS",
              "HEAD_SHA: ${pr.head.sha}",
              "comment.user?.login !== owner",
              "context: 'Codex Audit Gate'",
              "state: passed ? 'success' : 'failure'",
          )
          missing = [value for value in gate_required if value not in gate]
          assert not missing, f"Codex exact-head gate missing: {missing}"
          assert "actions/checkout" not in gate

          ci = Path(".github/workflows/ci.yml").read_text()
          smoke = ci.split("  browser-smoke:", 1)[1].split("\n  security:", 1)[0]
          assert "SUPABASE_JWT_SECRET:" not in smoke, (
              "browser-smoke must not pin SUPABASE_JWT_SECRET; generate it at runtime"
          )
          assert "token_urlsafe" in smoke
          assert "GITHUB_ENV" in smoke

          staging = Path("docker-compose.staging.yml").read_text()
          assert "5432:5432" not in staging
          assert "${POSTGRES_PASSWORD:?required}" in staging
          assert "${APP_RUNTIME_PASSWORD:?required}" in staging
          assert "postgresql://app_runtime:${APP_RUNTIME_PASSWORD:?required}" in staging
          assert "postgresql://postgres:postgres@" not in staging
          assert "postgresql://app_runtime:app_runtime@" not in staging
          assert "${ENVIRONMENT" not in staging
          assert staging.count("ENVIRONMENT: staging") >= 3
          worker = service_block(staging, "worker")
          assert "\n    env_file:" not in worker
          assert "DATABASE_URL" not in worker
          assert "POSTGRES_PASSWORD" not in worker
          automation = service_block(staging, "automation")
          assert 'restart: unless-stopped' in automation
          assert 'command: ["python", "-m", "app.automation"]' in automation
          assert "\n    ports:" not in automation
          assert "healthcheck:" in automation
          assert "_owner_id" in automation
          assert "automation_health_snapshot" in automation
          entrypoint = Path("apps/api/docker-entrypoint.sh").read_text()
          assert "python -m app.db.runtime_role" in entrypoint

          watchdog = Path(".github/workflows/build-watchdog.yml").read_text()
          assert "failure|cancelled|timed_out|stale|startup_failure)" in watchdog
          assert "action_required)" in watchdog
          assert "stale|action_required)" not in watchdog
          assert "success|neutral|skipped)" not in watchdog
          assert "dispatch \"${head_branch:-$default_branch}\"" not in watchdog
          assert "CI exhausted its single stale-run retry" in watchdog
          assert 'actions/runs/$run_id/rerun"' in watchdog

          assert "queued|in_progress|requested|waiting|pending)" not in watchdog
          assert "queued|in_progress|requested|pending)" in watchdog
          assert "waiting on a deployment-protection approval" in watchdog

          assert "monitors only the latest repository CI run" in watchdog
          assert "cannot restart stopped AI coding sessions" in watchdog

          protocol = Path(".github/AGENT_OPERATING_PROTOCOL.md").read_text()
          assert "latest repository CI run only" in protocol
          assert "cannot restart a stopped coding-agent session" in protocol

          agent_guides = {
              "CLAUDE.md": Path("CLAUDE.md").read_text(),
              ".github/copilot-instructions.md": Path(
                  ".github/copilot-instructions.md"
              ).read_text(),
              ".cursor/rules/agent-coordination.mdc": Path(
                  ".cursor/rules/agent-coordination.mdc"
              ).read_text(),
          }
          required_routes = (
              "AGENTS.md",
              ".github/AGENT_OPERATING_PROTOCOL.md",
              "issues/90",
          )
          for path, guide in agent_guides.items():
              missing = [route for route in required_routes if route not in guide]
              assert not missing, f"{path} coordination routes missing: {missing}"

          assert "pair assistant" in agent_guides[
              ".github/copilot-instructions.md"
          ].lower()
          assert "one Builder" in agent_guides[
              ".cursor/rules/agent-coordination.mdc"
          ]
          PY
      - name: Install API package (for dependency graph)
        working-directory: apps/api
        run: pip install -e ".[dev]" -c constraints-prod.txt
      - name: pip-audit (API)
        # P-003/P-004: fail-closed on known vulnerabilities in the installed
        # project graph. Local packages are skipped; PyPI deps must be clean.
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off
      - name: Install worker package (for dependency graph)
        working-directory: apps/worker
        run: pip install -e ".[dev]" -c constraints-prod.txt
      - name: pip-audit (worker)
        working-directory: apps/worker
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build -t content-orchestrator-api:ci ./apps/api
      - name: Build worker image
        run: docker build -t content-orchestrator-worker:ci ./apps/worker
      - name: Build web image
        run: docker build -t content-orchestrator-web:ci ./apps/web

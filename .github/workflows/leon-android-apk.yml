name: Leon Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/leon-android/**"
      - ".github/workflows/leon-android-apk.yml"
  push:
    branches:
      - main
      - "claude/**"
      - "feature/leon-**"
    paths:
      - "apps/leon-android/**"
      - ".github/workflows/leon-android-apk.yml"
  workflow_dispatch:

jobs:
  build-leon-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: apps/leon-android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Leon-unit-test-report
          path: apps/leon-android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Lint
        working-directory: apps/leon-android
        run: gradle :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Leon-lint-report
          path: apps/leon-android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        working-directory: apps/leon-android
        run: gradle :app:assembleDebug -PleonVersionCode=${{ github.run_number }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Leon-Companion-debug-apk
          path: apps/leon-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
